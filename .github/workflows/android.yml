
name: Build VoceaVie Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p /tmp/voceavie
          unzip -o VoceaVieAndroid_starter.zip -d /tmp/voceavie
          ls -la /tmp/voceavie/VoceaVieAndroid

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd /tmp/voceavie/VoceaVieAndroid
          gradle assembleDebug

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoceaVie-APK
          path: /tmp/voceavie/VoceaVieAndroid/app/build/outputs/apk/debug/*.apk
