
name: Build VoceaVie Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          echo "Checking repository files"
          find . -maxdepth 4 -type f | head -200

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f app/gradlew ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found. The Android project needs to be checked."
            exit 1
          fi

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoceaVie-APK
          path: '**/build/outputs/apk/debug/*.apk'
